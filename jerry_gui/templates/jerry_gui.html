<!DOCTYPE html>
<html>
    <head>
        <title>Jerry Detector</title>

        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

        <style>
            body { 
                background: black; 
                color: lime; 
                font-family: monospace;
            }

            #alertBox {
                display: none;
                position: fixed;
                bottom: 20px;
                right: 20px;
                background: rgba(253, 7, 7, 0.886);
                padding: 50px;
            }

            #loading {
                position: fixed;
                width: 100%;
                height: 100%;
                background: black;
                color: lime;
                display: flex;
                justify-content: center;
                align-items: center;
                font-size: 2em;
            }
            
            .loader-content {
                text-align: center;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            }

            .spinner {
                width: 60px;
                height: 60px;
                border: 5px solid #222;
                border-top: 5px solid lime;
                border-radius: 50%;
                margin: 20px auto;
                animation: spin 1s linear infinite;
            }

            @keyframes spin {
                from { transform: rotate(0deg); }
                to { transform: rotate(360deg); }
            }

            .title {
                margin: auto;

            }

            .container {
                max-width: 1000px;
                margin: auto;
                padding: 20px;
            }

            .card {
                background: #111;
                border: 1px lime;
                padding: 20px;
                margin-top: 20px;
                border-radius: 10px;
            }



            /* HAMSTER WHEEL */
            /* From Uiverse.io by Nawsome */ 
            .wheel-and-hamster {
            --dur: 1s;
            position: relative;
            width: 12em;
            height: 12em;
            font-size: 14px;
            }

            .wheel,
            .hamster,
            .hamster div,
            .spoke {
            position: absolute;
            }

            .wheel,
            .spoke {
            border-radius: 50%;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            }

            .wheel {
            background: radial-gradient(100% 100% at center,hsla(0,0%,60%,0) 47.8%,hsl(0,0%,60%) 48%);
            z-index: 2;
            }

            .hamster {
            animation: hamster var(--dur) ease-in-out infinite;
            top: 50%;
            left: calc(50% - 3.5em);
            width: 7em;
            height: 3.75em;
            transform: rotate(4deg) translate(-0.8em,1.85em);
            transform-origin: 50% 0;
            z-index: 1;
            }

            .hamster__head {
            animation: hamsterHead var(--dur) ease-in-out infinite;
            background: hsl(0, 0%, 65%);
            border-radius: 70% 30% 0 100% / 40% 25% 25% 60%;
            box-shadow: 0 -0.2em 0 hsl(0, 0%, 50%) inset;
            top: 0;
            left: -2em;
            width: 2.75em;
            height: 2.5em;
            transform-origin: 100% 50%;
            }

            .hamster__ear {
            animation: hamsterEar var(--dur) ease-in-out infinite;
            background: hsl(0,90%,85%);
            border-radius: 50%;
            box-shadow: 0 -0.2em 0 hsl(0, 0%, 50%) inset;
            top: -0.25em;
            right: -0.25em;
            width: 0.75em;
            height: 0.75em;
            transform-origin: 50% 75%;
            }

            .hamster__eye {
            animation: hamsterEye var(--dur) linear infinite;
            background-color: hsl(0,0%,0%);
            border-radius: 50%;
            top: 0.375em;
            left: 1.25em;
            width: 0.5em;
            height: 0.5em;
            }

            .hamster__nose {
            background: hsl(0,90%,75%);
            border-radius: 35% 65% 85% 15% / 70% 50% 50% 30%;
            top: 0.75em;
            left: 0;
            width: 0.2em;
            height: 0.25em;
            }

            .hamster__body {
            animation: hamsterBody var(--dur) ease-in-out infinite;
            background: hsl(0, 0%, 65%);
            box-shadow: 0 -0.2em 0 hsl(0, 0%, 50%) inset,
                        ;
            border-radius: 50% 30% 50% 30% / 15% 60% 40% 40%;
            top: 0.25em;
            left: 2em;
            width: 4.5em;
            height: 3em;
            transform-origin: 17% 50%;
            transform-style: preserve-3d;
            }

            .hamster__limb--fr,
            .hamster__limb--fl {
            clip-path: polygon(0 0,100% 0,70% 80%,60% 100%,0% 100%,40% 80%);
            top: 2em;
            left: 0.5em;
            width: 1em;
            height: 1.5em;
            transform-origin: 50% 0;
            }

            .hamster__limb--fr {
            animation: hamsterFRLimb var(--dur) linear infinite;
            background: linear-gradient(hsl(0, 0%, 50%) 80%,hsl(0,90%,75%) 80%);
            transform: rotate(15deg) translateZ(-1px);
            }

            .hamster__limb--fl {
            animation: hamsterFLLimb var(--dur) linear infinite;
            background: linear-gradient(hsl(0, 0%, 65%) 80%,hsl(0,90%,85%) 80%);
            transform: rotate(15deg);
            }

            .hamster__limb--br,
            .hamster__limb--bl {
            border-radius: 0.75em 0.75em 0 0;
            clip-path: polygon(0 0,100% 0,100% 30%,70% 90%,70% 100%,30% 100%,40% 90%,0% 30%);
            top: 1em;
            left: 2.8em;
            width: 1.5em;
            height: 2.5em;
            transform-origin: 50% 30%;
            }

            .hamster__limb--br {
            animation: hamsterBRLimb var(--dur) linear infinite;
            background: linear-gradient(hsl(0, 0%, 50%) 90%,hsl(0,90%,75%) 90%);
            transform: rotate(-25deg) translateZ(-1px);
            }

            .hamster__limb--bl {
            animation: hamsterBLLimb var(--dur) linear infinite;
            background: linear-gradient(hsl(0, 0%, 65%) 90%,hsl(0,90%,85%) 90%);
            transform: rotate(-25deg);
            }

            .hamster__tail {
            animation: hamsterTail var(--dur) linear infinite;
            background: hsl(0,90%,85%);
            border-radius: 999px;
            box-shadow: 0 -0.2em 0 hsl(0,90%,75%) inset;
            top: 1.2em;
            right: -1.8em;
            width: 2.5em;
            height: 0.3em;
            transform: rotate(25deg) translateZ(-1px);
            transform-origin: 0.25em 0.25em;
            }

            .spoke {
            animation: spoke var(--dur) linear infinite;
            background: radial-gradient(100% 100% at center,hsl(0,0%,60%) 4.8%,hsla(0,0%,60%,0) 5%),
                    linear-gradient(hsla(0,0%,55%,0) 46.9%,hsl(0,0%,65%) 47% 52.9%,hsla(0,0%,65%,0) 53%) 50% 50% / 99% 99% no-repeat;
            }

            /* Animations */
            @keyframes hamster {
            from, to {
                transform: rotate(4deg) translate(-0.8em,1.85em);
            }

            50% {
                transform: rotate(0) translate(-0.8em,1.85em);
            }
            }

            @keyframes hamsterHead {
            from, 25%, 50%, 75%, to {
                transform: rotate(0);
            }

            12.5%, 37.5%, 62.5%, 87.5% {
                transform: rotate(8deg);
            }
            }

            @keyframes hamsterEye {
            from, 90%, to {
                transform: scaleY(1);
            }

            95% {
                transform: scaleY(0);
            }
            }

            @keyframes hamsterEar {
            from, 25%, 50%, 75%, to {
                transform: rotate(0);
            }

            12.5%, 37.5%, 62.5%, 87.5% {
                transform: rotate(12deg);
            }
            }

            @keyframes hamsterBody {
            from, 25%, 50%, 75%, to {
                transform: rotate(0);
            }

            12.5%, 37.5%, 62.5%, 87.5% {
                transform: rotate(-2deg);
            }
            }

            @keyframes hamsterFRLimb {
            from, 25%, 50%, 75%, to {
                transform: rotate(50deg) translateZ(-1px);
            }

            12.5%, 37.5%, 62.5%, 87.5% {
                transform: rotate(-30deg) translateZ(-1px);
            }
            }

            @keyframes hamsterFLLimb {
            from, 25%, 50%, 75%, to {
                transform: rotate(-30deg);
            }

            12.5%, 37.5%, 62.5%, 87.5% {
                transform: rotate(50deg);
            }
            }

            @keyframes hamsterBRLimb {
            from, 25%, 50%, 75%, to {
                transform: rotate(-60deg) translateZ(-1px);
            }

            12.5%, 37.5%, 62.5%, 87.5% {
                transform: rotate(20deg) translateZ(-1px);
            }
            }

            @keyframes hamsterBLLimb {
            from, 25%, 50%, 75%, to {
                transform: rotate(20deg);
            }

            12.5%, 37.5%, 62.5%, 87.5% {
                transform: rotate(-60deg);
            }
            }

            @keyframes hamsterTail {
            from, 25%, 50%, 75%, to {
                transform: rotate(30deg) translateZ(-1px);
            }

            12.5%, 37.5%, 62.5%, 87.5% {
                transform: rotate(10deg) translateZ(-1px);
            }
            }

            @keyframes spoke {
            from {
                transform: rotate(0);
            }

            to {
                transform: rotate(-1turn);
            }
}
        </style>

    </head>
    <body>

        <!-- loading screen-->
        <div id="loading">
            <div class="loader-content">
                <h1 class="glitch">WHERE ARE YOU JERRY...</h1>
                <!-- <div class="spinner"></div> -->
                <div aria-label="Orange and tan hamster running in a metal wheel" role="img" class="wheel-and-hamster">
                    <div class="wheel"></div>
                    <div class="hamster">
                        <div class="hamster__body">
                            <div class="hamster__head">
                                <div class="hamster__ear"></div>
                                <div class="hamster__eye"></div>
                                <div class="hamster__nose"></div>
                            </div>
                            <div class="hamster__limb hamster__limb--fr"></div>
                            <div class="hamster__limb hamster__limb--fl"></div>
                            <div class="hamster__limb hamster__limb--br"></div>
                            <div class="hamster__limb hamster__limb--bl"></div>
                            <div class="hamster__tail"></div>
                        </div>
                    </div>
                    <div class="spoke"></div>
                </div>
            </div>
        </div>

        <!-- main page-->
        <div class="container">

            <div class="card">
                <h1>Jerry Detector</h1>
            </div>

            <div class="card">
                <h2> Jerry Status: </h2>
                <h3 id="status"> Loading ...</h3>
                <h3 id="24h_count"> Detections Over last 24hrs: 0</h3>
            </div>

            <!-- plot 1-->>
            <div class="card">
                <h3>Live Signal (detection rate per frame)</h3>
                <canvas id="signalChart"></canvas>
            </div>
            
            <!-- plot 2-->
            <div class="card">
                <canvas id="chart"></canvas>
            </div>

            <div class="card">
                <h3>Last 5 Jerry Sightings: </h3>
                <ul id="jerryDetectList"></ul>
            </div>

        </div>

        <!-- jerry meme recent sighting alert-->
        <div id="alertBox" style="display:none;">
            <h2>Jerry was detected in the last 30s!!</h2>
            <img src="{{ url_for('static', filename='jerry.png') }}" width="200">
            <audio id="alarm" src="{{ url_for('static', filename='alarm.mp3') }}"></audio>
        </div>


        <script>
            Chart.defaults.color = "lime";
            Chart.defaults.borderColor = "#222";

            // function to plot jerry dtection data
            let chart;
            function updateChart(events) {
                const times = events.map(e => new Date(e.time));
                
                const counts = {};
                times.forEach(t => {
                    const key = t.toISOString().slice(0,16); // minute resolution
                    counts[key] = (counts[key] || 0) + 1;
                });

                const labels = Object.keys(counts);
                const data = Object.values(counts);

                if (!chart) {

                    chart = new Chart(document.getElementById("chart"), {
                        type: "line",

                        data: {
                            labels: labels,
                            datasets: [{
                                label: "Detections over time",
                                data: data,
                                borderColor: "lime",
                                backgroundColor: "rgba(0,255,0,0.15)",
                                tension: 0.3
                            }]
                        },

                        options: {
                            responsive: true,
                            animation: false,
                            scales: {
                                x: {ticks: {color: "lime"},
                                    grid: {color: "#222"}},
                                y: {ticks: {color: "lime"},
                                    grid: {color: "#222"}}
                                },
                            plugins: { 
                                legend: {labels: {color: "lime"}}
                            }
                        }
                    });

                } else {
                    // UPDATE EXISTING CHART
                    chart.data.labels = labels;
                    chart.data.datasets[0].data = data;
                    chart.update("none"); // no animation
                }
            }

            // chart updater for the bf
            let signalChart;
            async function updateSignalChart() {
                const res    = await fetch("/signal");
                const frames = await res.json();

                const labels = frames.map(e => e.time.slice(11, 19));   // HH:MM:SS
                const data   = frames.map(e => e.detection_rate);

                // kill refresh animation
                if (!signalChart) {

                    signalChart = new Chart(document.getElementById("signalChart"), {
                        type: "line",

                        data: {
                            labels,
                            datasets: [{
                                label: "Detection rate",
                                data,
                                borderColor: "lime",
                                backgroundColor: "rgba(0,255,255,0.15)",
                                tension: 0.3
                            }]
                        },
                        options: {
                            responsive: true,
                            animation: false,
                            scales: {
                                x: {ticks: {color: "lime"},
                                    grid: {color: "#222"}},
                                y: {ticks: {color: "lime"},
                                    grid: {color: "#222"}}
                                },
                            plugins: { 
                                legend: {labels: {color: "lime"}}
                            }
                        }
                    });
                } else {
                    signalChart.data.labels = labels;
                    signalChart.data.datasets[0].data = data;
                    signalChart.update("none");
                }
            }

            // alert of recent rate detection
            function triggerAlert() {
                const box = document.getElementById("alertBox");
                box.style.display = "block";

                const alarm = document.getElementById("alarm");
                alarm.play();
            }

            function refreshBF() {
                const img = document.getElementById("bfPlot");
                img.src = "/static/current_bf.png?t=" + new Date().getTime();
            }


            // main html func
            async function loadEvents() {

                // Loading screen
                const loading = document.getElementById("loading");
                loading.style.display = "flex";

                const start = Date.now();

                // update main page from events page
                const fileLoader = await fetch("/events");
                const events = await fileLoader.json();

                updateChart(events)
                updateSignalChart()
                //refreshBF()

                // running list of all detection events
                const list = document.getElementById("jerryDetectList");
                list.innerHTML = "";

                // if json empty, no evets detected
                if (events.length === 0) {
                    document.getElementById("status").innerText =
                        "Jerry has not been detected yet ...";

                    // hide loading screen before returning incase o fno data
                    loading.style.transition = "opacity 1s ease";
                    loading.style.opacity = "0";

                    setTimeout(() => {
                        loading.style.display = "none";
                    }, 1000);

                    return;
                }

                document.getElementById("status").innerText = "Jerry has been detected";

                // only look at last 5 
                events.slice().reverse().slice(0, 5).forEach(e => {
                    const li = document.createElement("li");

                    li.textContent = `time of detection: ${e.time}, confidence: ${e.confidence.toFixed(2)}`;

                    list.appendChild(li)
                });


                // add detection counter for last 24hrs
                const now = new Date();
                const last24h = events.filter(e => {
                    const t = new Date(e.time)
                    return (now - t) < 24 * 60 * 60 * 1000;
                });

                document.getElementById("24h_count").innerText =
                    `Detections (24h): ${last24h.length}`;


                // if detected in last 30s, make update
                const recent = events.filter(e => {
                    const t = new Date(e.time);
                    return (now - t) < 30 * 1000;
                });

                if (recent.length > 0) {
                    triggerAlert();
                }
                
                // loading screen
                const elapsed = Date.now() - start;
                const minLoadTime = 1500;

                if (elapsed < minLoadTime) {
                    await new Promise(resolve =>
                        setTimeout(resolve, minLoadTime - elapsed)
                    );
                }

                // fade out
                loading.style.transition = "opacity 3s ease";
                loading.style.opacity = "0";
                setTimeout(() => {
                    loading.style.display = "none";
                }, 500);
            }

            setInterval(loadEvents, 2000); //refresh per second
            loadEvents();
        </script>

    </body>
</html>
